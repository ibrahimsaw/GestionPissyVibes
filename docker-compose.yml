services:
  db:
    image: postgres:16-alpine
    container_name: pissy_vibes_db
    restart: always
    environment:
      POSTGRES_DB: pissy_vibes_db
      POSTGRES_USER: pissy_user
      POSTGRES_PASSWORD: pissy_password_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pissy_user -d pissy_vibes_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: pissy_vibes_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      - DEBUG=False
      - SECRET_KEY=pissy-vibes-prod-secret-key-burkina-faso-2026
      - ALLOWED_HOSTS=*
      - CSRF_TRUSTED_ORIGINS=https://pissyvibes.regies.tech,http://pissyvibes.regies.tech,https://*.regies.tech,http://*.regies.tech,http://187.124.54.132:8095
      - DATABASE_URL=postgres://pissy_user:pissy_password_2026@db:5432/pissy_vibes_db
      - DJANGO_SETTINGS_MODULE=config.settings.production
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8095:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_volume:
  media_volume:
