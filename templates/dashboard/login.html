<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Espace Gestion | {{ site_settings.site_name|default:"Pissy Vibes" }}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #111827 0%, #1F2937 50%, #15803D 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .login-card {
            background: #FFFFFF;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
        }
    </style>
</head>
<body>
    <div class="login-card text-center">
        <div class="d-inline-flex align-items-center justify-content-center bg-success text-white rounded-circle p-3 mb-3 shadow-sm" style="width: 64px; height: 64px;">
            <i class="bi bi-shield-lock-fill fs-2"></i>
        </div>
        
        <h2 class="font-heading h4 fw-bold text-dark mb-1">Espace Gestion</h2>
        <p class="text-muted small mb-4">Portail réservé aux gestionnaires de {{ site_settings.site_name|default:"Pissy Vibes" }}</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'danger' }} small py-2 text-start rounded-3 mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="" class="text-start">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Nom d'utilisateur</label>
                {{ form.username }}
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-dark">Mot de passe</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold shadow-sm">
                <i class="bi bi-box-arrow-in-right me-2"></i> Se Connecter
            </button>
        </form>

        <div class="mt-4 pt-3 border-top">
            <a href="{% url 'core:home' %}" class="text-decoration-none text-muted small">
                <i class="bi bi-arrow-left me-1"></i> Retourner sur le site public
            </a>
        </div>
    </div>
</body>
</html>
