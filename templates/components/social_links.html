<div class="d-flex align-items-center gap-2 flex-wrap">
    {% if site_settings.facebook_url %}
        <a href="{{ site_settings.facebook_url }}" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Facebook">
            <i class="bi bi-facebook"></i>
        </a>
    {% endif %}
    {% if site_settings.instagram_url %}
        <a href="{{ site_settings.instagram_url }}" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="Instagram">
            <i class="bi bi-instagram"></i>
        </a>
    {% endif %}
    {% if site_settings.tiktok_url %}
        <a href="{{ site_settings.tiktok_url }}" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="TikTok">
            <i class="bi bi-tiktok"></i>
        </a>
    {% endif %}
    {% if site_settings.youtube_url %}
        <a href="{{ site_settings.youtube_url }}" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="YouTube">
            <i class="bi bi-youtube"></i>
        </a>
    {% endif %}
    {% if site_settings.twitter_url %}
        <a href="{{ site_settings.twitter_url }}" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="X (Twitter)">
            <i class="bi bi-twitter-x"></i>
        </a>
    {% endif %}
    {% if site_settings.linkedin_url %}
        <a href="{{ site_settings.linkedin_url }}" target="_blank" rel="noopener noreferrer" class="social-btn" aria-label="LinkedIn">
            <i class="bi bi-linkedin"></i>
        </a>
    {% endif %}
</div>
