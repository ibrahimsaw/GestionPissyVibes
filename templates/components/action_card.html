<div class="pv-card">
    <div class="pv-card-img-wrapper">
        {% if action.cover_image %}
            <img src="{{ action.cover_image.url }}" alt="{{ action.title }}" class="pv-card-img" loading="lazy">
        {% else %}
            <div class="w-100 h-100 d-flex align-items-center justify-content-center bg-secondary-subtle text-muted">
                <i class="bi bi-camera fs-1 opacity-50"></i>
            </div>
        {% endif %}
        <span class="pv-card-badge {{ action.get_status_badge }}">{{ action.get_category_display }}</span>
    </div>
    <div class="pv-card-body">
        <div class="pv-card-meta">
            <span><i class="bi bi-calendar3 me-1 text-success"></i> {{ action.date|date:"d M Y" }}</span>
            <span><i class="bi bi-geo-alt me-1 text-danger"></i> {{ action.location }}</span>
        </div>
        <h3 class="pv-card-title">
            <a href="{{ action.get_absolute_url }}">{{ action.title }}</a>
        </h3>
        <p class="text-muted small mb-3 flex-grow-1">
            {{ action.excerpt|truncatewords:18 }}
        </p>
        <div class="d-flex align-items-center justify-content-between pt-2 border-top">
            <span class="small text-muted font-monospace">
                <i class="bi bi-people-fill me-1 text-primary"></i> {{ action.participants_count }} participants
            </span>
            <a href="{{ action.get_absolute_url }}" class="btn btn-sm btn-pv-outline">Détails <i class="bi bi-arrow-right"></i></a>
        </div>
    </div>
</div>
